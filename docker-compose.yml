services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo-express:
    image: mongo-express:1
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017
      ME_CONFIG_BASICAUTH: "true"
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_USER}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASSWORD}
    depends_on:
      mongo:
        condition: service_healthy

  # One-shot job on every start: loads the demo data if the database is empty,
  # then rebuilds the item similarities. Uses the same image as the api.
  init:
    build: .
    env_file: .env
    environment:
      MONGO_URI: mongodb://mongo:27017
    entrypoint: ["sh", "-c", "seed --if-empty && recompute"]
    restart: "no"
    depends_on:
      mongo:
        condition: service_healthy

  api:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      MONGO_URI: mongodb://mongo:27017
      # precomputed (default) or live; the perf script switches them
      RECS_MODE: ${RECS_MODE:-precomputed}
      # lifetime of cached recommendations per user, 0 = no cache
      CACHE_TTL: ${CACHE_TTL:-60s}
    depends_on:
      mongo:
        condition: service_healthy
      init:
        condition: service_completed_successfully

  web:
    build:
      context: ./web
      args:
        # The browser calls the API at this address.
        VITE_API_URL: http://localhost:8080
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  mongo_data:
